[package]
name = "fla-reanim"
version = "2.0.0"
edition = "2024"
default-run = "FlaReanimCompiler"
build = "build.rs"

[lib]
name = "fla_reanim"

[[bin]]
name = "FlaReanimCompiler"
path = "src/gui.rs"

[[bin]]
name = "fla-reanim-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
resvg = { version = "0.45", default-features = false }
regex = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
naui-winui3 = "0.16"
windows = { version = "0.62", features = ["ApplicationModel_DataTransfer", "Foundation", "Foundation_Collections", "Storage", "Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_WinRT", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"
windows-future = "0.3"
windows-collections = "0.3"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

name: Native FLA converter

on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - .cargo/**
      - src/**
      - ui/**
      - data/**
      - tests/**
      - Packaging/**
      - app.manifest
      - README.md
      - LICENSE
      - .github/workflows/fla-reanim.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - .cargo/**
      - src/**
      - ui/**
      - data/**
      - tests/**
      - Packaging/**
      - app.manifest
      - README.md
      - LICENSE
      - .github/workflows/fla-reanim.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: ./Packaging/BuildRelease.ps1 -DestinationDirectory dist/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: FLA-Reanim-Compiler-win-x64
          if-no-files-found: error
          path: |
            dist/win-x64/FLA-Reanim-Compiler-win-x64.zip
            dist/win-x64/release-manifest.json
